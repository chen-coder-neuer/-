<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Royal Liar's Dice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #051a14;
      }
      h1, h2, h3, .font-serif {
        font-family: 'Playfair Display', serif;
      }
      /* Felt Texture Effect */
      .felt-bg {
        background-color: #0f3d2e;
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.2) 100%),
          url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
      }
      
      /* Gold Metallic Text/Border Effect */
      .text-gold {
        color: #D4AF37;
        text-shadow: 0px 1px 2px rgba(0,0,0,0.5);
      }
      .border-gold {
        border-color: #D4AF37;
        box-shadow: inset 0 0 5px rgba(255, 236, 179, 0.4), 0 2px 4px rgba(0,0,0,0.4);
      }
      .bg-gold-gradient {
        background: linear-gradient(180deg, #F2D06B 0%, #B38B38 100%);
      }
      .shadow-chip {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.3);
      }

      /* Animation for Numbers */
      @keyframes blurPop {
        0% {
          filter: blur(4px);
          opacity: 0.4;
          transform: scale(0.9);
        }
        50% {
          filter: blur(0px);
          opacity: 1;
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }
      .animate-blur-pop {
        animation: blurPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* Dice Rolling Animation */
      @keyframes diceRoll {
        0% {
          transform: rotate(0deg) scale(1);
        }
        25% {
           transform: rotate(90deg) scale(0.9);
        }
        50% {
          transform: rotate(180deg) scale(0.8);
          filter: blur(2px);
        }
        75% {
           transform: rotate(270deg) scale(0.9);
        }
        100% {
          transform: rotate(360deg) scale(1);
          filter: blur(0px);
        }
      }
      .animate-dice-roll {
        animation: diceRoll 0.5s ease-out;
      }

      /* Shimmer/Sheen Animation for Button */
      @keyframes shimmer {
        0% { left: -100%; opacity: 0; }
        5% { opacity: 0.5; }
        40% { left: 200%; opacity: 0; }
        100% { left: 200%; opacity: 0; }
      }
      .animate-shimmer {
        animation: shimmer 4s infinite cubic-bezier(0.4, 0, 0.2, 1); 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
